# asset configuration, rendered by the gateway's add-module wizard: every
# ${...} below was filled from the core's own configuration, so the issuer,
# trust domain and addresses match the core exactly. The store, event bus and
# object store are this bundle's own (compose.yaml), reached over TLS signed by
# the bundle's local CA.
service_name: asset
trust_domain: ${TRUST_DOMAIN}
env: production
identity:
  provider: provided
mesh_enroll:
  enabled: true
  enroll_url: ${LCM_ENROLL_URL}
  lcm_grpc: ${LCM_GRPC}
  tenant_id: ${MESH_TENANT_ID}
  token_file: /tokens/enrollment.token
  state_file: /state/svid.json
authz: { source: file, path: /app/policy.yaml }
server: { grpc_addr: 0.0.0.0:9995, http_addr: 0.0.0.0:9996 }
admin: { addr: 127.0.0.1:9830 }
# Only the core is known here: inventory-sync, paperless and the platform
# scheduler live on other hosts (see deploy/bundle/README.md).
discovery:
  static:
    gateway: ["${GATEWAY_GRPC}"]
    auth: ["${AUTH_GRPC}"]
limits: { max_request_bytes: 33554432 }
limits_asset: { max_request_bytes: 1048576, max_backup_bytes: 33554432 }
db:
  dsn: postgres://asset_app:${GEN_PASSWORD_2}@asset-db:5432/asset?sslmode=verify-full&sslrootcert=/tls/ca.pem
  migrate_dsn: postgres://postgres:${GEN_PASSWORD_1}@asset-db:5432/asset?sslmode=verify-full&sslrootcert=/tls/ca.pem
  max_conns: 16
valkey: { addresses: ["asset-valkey:6379"], username: asset, password: ${GEN_PASSWORD_3}, ca_file: /tls/ca.pem }
kek: { source: env, env: ASSET_KEK }
# Photos and documents: the bundle's RustFS (its CA is trusted via SSL_CERT_DIR).
object_store:
  endpoint: asset-s3:9000
  bucket: asset
  region: us-east-1
  use_ssl: true
  access_key: asset
  secret_key: ${GEN_PASSWORD_4}
  presign_ttl_seconds: 300
inventory: { service: inventory }
paperless: { enabled: false, service: paperless }
task_scheduler: { enabled: false, service: scheduler }
scheduler: { interval_seconds: 3600, warranty_soon_days: 30, license_soon_days: 30, insurance_soon_days: 30 }
uploads: { max_size_bytes: 20971520 }
events: { enabled: true }
gateway: { service: gateway, issuer: ${GATEWAY_ISSUER} }
