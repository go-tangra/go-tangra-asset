syntax = "proto3";

package asset.service.v1;

import "google/api/annotations.proto";

// PortalUser represents a user from the portal admin-service
message PortalUser {
  uint32 id = 1 [json_name = "id"];
  string username = 2 [json_name = "username"];
  string realname = 3 [json_name = "realname"];
  string email = 4 [json_name = "email"];
  repeated string org_unit_names = 5 [json_name = "orgUnitNames"];
  repeated string position_names = 6 [json_name = "positionNames"];
}

// ListUsersRequest lists portal users for asset assignment
message ListUsersRequest {}

message ListUsersResponse {
  repeated PortalUser items = 1 [json_name = "items"];
  optional int32 total = 2 [json_name = "total"];
}

// UserService provides access to portal users for asset assignment
service UserService {
  // List portal users available for asset assignment
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
  }
}
