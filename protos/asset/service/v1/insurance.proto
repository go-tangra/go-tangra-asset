syntax = "proto3";

package asset.service.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";

// InsurancePolicyStatus represents the state of an insurance policy
enum InsurancePolicyStatus {
  INSURANCE_POLICY_STATUS_UNSPECIFIED = 0;
  INSURANCE_POLICY_STATUS_ACTIVE = 1;
  INSURANCE_POLICY_STATUS_EXPIRED = 2;
  INSURANCE_POLICY_STATUS_CANCELLED = 3;
}

// CoverageType represents the type of insurance coverage
enum CoverageType {
  COVERAGE_TYPE_UNSPECIFIED = 0;
  COVERAGE_TYPE_ALL_RISK = 1;
  COVERAGE_TYPE_FIRE_THEFT = 2;
  COVERAGE_TYPE_LIABILITY = 3;
  COVERAGE_TYPE_EQUIPMENT_BREAKDOWN = 4;
  COVERAGE_TYPE_CYBER = 5;
}

// InsurancePolicy represents an insurance policy
message InsurancePolicy {
  // Unique identifier
  optional string id = 1 [json_name = "id"];

  // Tenant ID for multi-tenancy
  optional uint32 tenant_id = 2 [json_name = "tenantId"];

  // Policy name
  optional string name = 3 [json_name = "name"];

  // Policy number
  optional string policy_number = 4 [json_name = "policyNumber"];

  // Insurance provider
  optional string provider = 5 [json_name = "provider"];

  // Coverage type
  optional CoverageType coverage_type = 6 [json_name = "coverageType"];

  // Premium amount
  optional double premium_amount = 7 [json_name = "premiumAmount"];

  // Deductible
  optional double deductible = 8 [json_name = "deductible"];

  // Coverage limit
  optional double coverage_limit = 9 [json_name = "coverageLimit"];

  // Valid from date
  optional google.protobuf.Timestamp valid_from = 10 [json_name = "validFrom"];

  // Valid to date
  optional google.protobuf.Timestamp valid_to = 11 [json_name = "validTo"];

  // Policy status
  optional InsurancePolicyStatus status = 12 [json_name = "status"];

  // Notes
  optional string notes = 13 [json_name = "notes"];

  // Custom metadata (JSON)
  google.protobuf.Struct metadata = 15 [json_name = "metadata"];

  // Number of assets covered by this policy
  optional int32 asset_count = 14 [json_name = "assetCount"];

  // Creation timestamp
  optional google.protobuf.Timestamp created_at = 30 [json_name = "createdAt"];

  // Last update timestamp
  optional google.protobuf.Timestamp updated_at = 31 [json_name = "updatedAt"];

  // Creator user ID
  optional uint32 created_by = 32 [json_name = "createdBy"];

  // Last updater user ID
  optional uint32 updated_by = 33 [json_name = "updatedBy"];
}

// PolicyAsset represents an asset attached to an insurance policy
message PolicyAsset {
  // Policy ID
  optional string policy_id = 1 [json_name = "policyId"];

  // Asset ID
  optional string asset_id = 2 [json_name = "assetId"];

  // Covered value for this asset
  optional double covered_value = 3 [json_name = "coveredValue"];

  // Notes
  optional string notes = 4 [json_name = "notes"];

  // Denormalized: asset tag
  optional string asset_tag = 5 [json_name = "assetTag"];

  // Denormalized: asset name
  optional string asset_name = 6 [json_name = "assetName"];

  // Denormalized: model name
  optional string model_name = 7 [json_name = "modelName"];
}

// CreateInsurancePolicyRequest creates a new insurance policy
message CreateInsurancePolicyRequest {
  optional uint32 tenant_id = 1 [
    json_name = "tenantId",
    (google.api.field_behavior) = REQUIRED
  ];

  optional string name = 2 [
    json_name = "name",
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (google.api.field_behavior) = REQUIRED
  ];

  optional string policy_number = 3 [json_name = "policyNumber"];
  optional string provider = 4 [json_name = "provider"];
  optional CoverageType coverage_type = 5 [json_name = "coverageType"];
  optional double premium_amount = 6 [json_name = "premiumAmount"];
  optional double deductible = 7 [json_name = "deductible"];
  optional double coverage_limit = 8 [json_name = "coverageLimit"];
  optional google.protobuf.Timestamp valid_from = 9 [json_name = "validFrom"];
  optional google.protobuf.Timestamp valid_to = 10 [json_name = "validTo"];
  optional InsurancePolicyStatus status = 11 [json_name = "status"];
  optional string notes = 12 [json_name = "notes"];
  google.protobuf.Struct metadata = 13 [json_name = "metadata"];
}

message CreateInsurancePolicyResponse {
  InsurancePolicy insurance_policy = 1 [json_name = "insurancePolicy"];
}

// GetInsurancePolicyRequest retrieves an insurance policy by ID
message GetInsurancePolicyRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
}

message GetInsurancePolicyResponse {
  InsurancePolicy insurance_policy = 1 [json_name = "insurancePolicy"];
}

// ListInsurancePoliciesRequest lists insurance policies with filtering
message ListInsurancePoliciesRequest {
  optional uint32 tenant_id = 1 [json_name = "tenantId"];
  optional int32 page = 2 [json_name = "page"];
  optional int32 page_size = 3 [json_name = "pageSize"];
  optional bool no_paging = 4 [json_name = "noPaging"];
  optional string query = 5 [json_name = "query"];
  repeated string order_by = 6 [json_name = "orderBy"];
  optional string field_mask = 7 [json_name = "fieldMask"];

  // Filter by status
  optional InsurancePolicyStatus status = 10 [json_name = "status"];

  // Filter by coverage type
  optional CoverageType coverage_type = 11 [json_name = "coverageType"];
}

message ListInsurancePoliciesResponse {
  repeated InsurancePolicy items = 1 [json_name = "items"];
  optional int32 total = 2 [json_name = "total"];
}

// UpdateInsurancePolicyRequest updates an insurance policy
message UpdateInsurancePolicyRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  optional InsurancePolicy data = 2 [json_name = "data"];

  google.protobuf.FieldMask update_mask = 3 [json_name = "updateMask"];
}

message UpdateInsurancePolicyResponse {
  InsurancePolicy insurance_policy = 1 [json_name = "insurancePolicy"];
}

// DeleteInsurancePolicyRequest deletes an insurance policy
message DeleteInsurancePolicyRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
}

// AddAssetToPolicyRequest adds an asset to an insurance policy
message AddAssetToPolicyRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  string asset_id = 2 [
    json_name = "assetId",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  optional double covered_value = 3 [json_name = "coveredValue"];
  optional string notes = 4 [json_name = "notes"];
}

message AddAssetToPolicyResponse {
  PolicyAsset policy_asset = 1 [json_name = "policyAsset"];
}

// RemoveAssetFromPolicyRequest removes an asset from an insurance policy
message RemoveAssetFromPolicyRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  string asset_id = 2 [
    json_name = "assetId",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
}

// ListPolicyAssetsRequest lists assets for an insurance policy
message ListPolicyAssetsRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
}

message ListPolicyAssetsResponse {
  repeated PolicyAsset items = 1 [json_name = "items"];
}

// InsurancePolicyService manages insurance policies
service InsurancePolicyService {
  // Create a new insurance policy
  rpc CreateInsurancePolicy(CreateInsurancePolicyRequest) returns (CreateInsurancePolicyResponse) {
    option (google.api.http) = {
      post: "/v1/insurance-policies"
      body: "*"
    };
  }

  // Get an insurance policy by ID
  rpc GetInsurancePolicy(GetInsurancePolicyRequest) returns (GetInsurancePolicyResponse) {
    option (google.api.http) = {
      get: "/v1/insurance-policies/{id}"
    };
  }

  // List insurance policies with filtering
  rpc ListInsurancePolicies(ListInsurancePoliciesRequest) returns (ListInsurancePoliciesResponse) {
    option (google.api.http) = {
      get: "/v1/insurance-policies"
    };
  }

  // Update an insurance policy
  rpc UpdateInsurancePolicy(UpdateInsurancePolicyRequest) returns (UpdateInsurancePolicyResponse) {
    option (google.api.http) = {
      put: "/v1/insurance-policies/{id}"
      body: "*"
    };
  }

  // Delete an insurance policy
  rpc DeleteInsurancePolicy(DeleteInsurancePolicyRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/insurance-policies/{id}"
    };
  }

  // List assets for an insurance policy
  rpc ListPolicyAssets(ListPolicyAssetsRequest) returns (ListPolicyAssetsResponse) {
    option (google.api.http) = {
      get: "/v1/insurance-policies/{id}/assets"
    };
  }

  // Add an asset to an insurance policy
  rpc AddAssetToPolicy(AddAssetToPolicyRequest) returns (AddAssetToPolicyResponse) {
    option (google.api.http) = {
      post: "/v1/insurance-policies/{id}/assets"
      body: "*"
    };
  }

  // Remove an asset from an insurance policy
  rpc RemoveAssetFromPolicy(RemoveAssetFromPolicyRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/insurance-policies/{id}/assets/{asset_id}"
    };
  }
}
