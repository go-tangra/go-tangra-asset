syntax = "proto3";

package asset.service.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "redact/v3/redact.proto";

// Supplier represents a vendor/supplier of assets and consumables
message Supplier {
  // Unique identifier
  optional string id = 1 [json_name = "id"];

  // Tenant ID for multi-tenancy
  optional uint32 tenant_id = 2 [json_name = "tenantId"];

  // Supplier name
  optional string name = 3 [json_name = "name"];

  // Supplier code (short identifier)
  optional string code = 4 [json_name = "code"];

  // Physical address
  optional string address = 5 [json_name = "address"];

  // City
  optional string city = 6 [json_name = "city"];

  // State/Province
  optional string state = 7 [json_name = "state"];

  // Country
  optional string country = 8 [json_name = "country"];

  // Postal code
  optional string postal_code = 9 [json_name = "postalCode"];

  // Contact person
  optional string contact_person = 10 [(redact.v3.value).string = "", json_name = "contactPerson"];

  // Telephone
  optional string telephone = 11 [(redact.v3.value).string = "", json_name = "telephone"];

  // Email
  optional string email = 12 [(redact.v3.value).string = "", json_name = "email"];

  // Website
  optional string website = 13 [json_name = "website"];

  // Notes
  optional string notes = 14 [json_name = "notes"];

  // Custom tags (JSON)
  optional string tags = 15 [json_name = "tags"];

  // Custom metadata (JSON)
  google.protobuf.Struct metadata = 16 [json_name = "metadata"];

  // Supplier status: 1=Active, 2=Inactive
  optional int32 status = 17 [json_name = "status"];

  // Creation timestamp
  optional google.protobuf.Timestamp created_at = 20 [json_name = "createdAt"];

  // Last update timestamp
  optional google.protobuf.Timestamp updated_at = 21 [json_name = "updatedAt"];

  // Creator user ID
  optional uint32 created_by = 22 [json_name = "createdBy"];

  // Last updater user ID
  optional uint32 updated_by = 23 [json_name = "updatedBy"];
}

// CreateSupplierRequest creates a new supplier
message CreateSupplierRequest {
  optional uint32 tenant_id = 1 [
    json_name = "tenantId",
    (google.api.field_behavior) = REQUIRED
  ];

  optional string name = 2 [
    json_name = "name",
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (google.api.field_behavior) = REQUIRED
  ];

  optional string code = 3 [json_name = "code"];
  optional string address = 4 [json_name = "address"];
  optional string city = 5 [json_name = "city"];
  optional string state = 6 [json_name = "state"];
  optional string country = 7 [json_name = "country"];
  optional string postal_code = 8 [json_name = "postalCode"];
  optional string contact_person = 9 [(redact.v3.value).string = "", json_name = "contactPerson"];
  optional string telephone = 10 [(redact.v3.value).string = "", json_name = "telephone"];
  optional string email = 11 [(redact.v3.value).string = "", json_name = "email"];
  optional string website = 12 [json_name = "website"];
  optional string notes = 13 [json_name = "notes"];
  optional string tags = 14 [json_name = "tags"];
  google.protobuf.Struct metadata = 15 [json_name = "metadata"];
  optional int32 status = 16 [json_name = "status"];
}

message CreateSupplierResponse {
  Supplier supplier = 1 [json_name = "supplier"];
}

// GetSupplierRequest retrieves a supplier by ID
message GetSupplierRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
}

message GetSupplierResponse {
  Supplier supplier = 1 [json_name = "supplier"];
}

// ListSuppliersRequest lists suppliers with filtering
message ListSuppliersRequest {
  optional uint32 tenant_id = 1 [json_name = "tenantId"];
  optional int32 page = 2 [json_name = "page"];
  optional int32 page_size = 3 [json_name = "pageSize"];
  optional bool no_paging = 4 [json_name = "noPaging"];
  optional string query = 5 [json_name = "query"];
  repeated string order_by = 6 [json_name = "orderBy"];
  optional string field_mask = 7 [json_name = "fieldMask"];

  // Filter by status
  optional int32 status = 10 [json_name = "status"];
}

message ListSuppliersResponse {
  repeated Supplier items = 1 [json_name = "items"];
  optional int32 total = 2 [json_name = "total"];
}

// UpdateSupplierRequest updates a supplier
message UpdateSupplierRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  optional Supplier data = 2 [json_name = "data"];

  google.protobuf.FieldMask update_mask = 3 [json_name = "updateMask"];
}

message UpdateSupplierResponse {
  Supplier supplier = 1 [json_name = "supplier"];
}

// DeleteSupplierRequest deletes a supplier
message DeleteSupplierRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
}

// SupplierService manages asset suppliers
service SupplierService {
  // Create a new supplier
  rpc CreateSupplier(CreateSupplierRequest) returns (CreateSupplierResponse) {
    option (google.api.http) = {
      post: "/v1/suppliers"
      body: "*"
    };
  }

  // Get a supplier by ID
  rpc GetSupplier(GetSupplierRequest) returns (GetSupplierResponse) {
    option (google.api.http) = {
      get: "/v1/suppliers/{id}"
    };
  }

  // List suppliers with filtering
  rpc ListSuppliers(ListSuppliersRequest) returns (ListSuppliersResponse) {
    option (google.api.http) = {
      get: "/v1/suppliers"
    };
  }

  // Update a supplier
  rpc UpdateSupplier(UpdateSupplierRequest) returns (UpdateSupplierResponse) {
    option (google.api.http) = {
      put: "/v1/suppliers/{id}"
      body: "*"
    };
  }

  // Delete a supplier
  rpc DeleteSupplier(DeleteSupplierRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/suppliers/{id}"
    };
  }
}
