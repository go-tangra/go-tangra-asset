syntax = "proto3";

package asset.service.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";

// AssetStatus represents the lifecycle state of an asset
enum AssetStatus {
  ASSET_STATUS_UNSPECIFIED = 0;
  ASSET_STATUS_DEPLOYABLE = 1;
  ASSET_STATUS_ASSIGNED = 2;
  ASSET_STATUS_BROKEN = 3;
  ASSET_STATUS_ARCHIVED = 4;
}

// AssignmentAction represents the type of assignment change
enum AssignmentAction {
  ASSIGNMENT_ACTION_UNSPECIFIED = 0;
  ASSIGNMENT_ACTION_ASSIGNED = 1;
  ASSIGNMENT_ACTION_UNASSIGNED = 2;
  ASSIGNMENT_ACTION_TRANSFERRED = 3;
}

// Asset represents an IT asset (laptop, PC, printer, etc.)
message Asset {
  // Unique identifier
  optional string id = 1 [json_name = "id"];

  // Tenant ID for multi-tenancy
  optional uint32 tenant_id = 2 [json_name = "tenantId"];

  // Asset tag (unique per tenant)
  optional string asset_tag = 3 [json_name = "assetTag"];

  // Asset name
  optional string name = 4 [json_name = "name"];

  // Serial number
  optional string serial = 5 [json_name = "serial"];

  // Model name
  optional string model_name = 6 [json_name = "modelName"];

  // Model number
  optional string model_number = 7 [json_name = "modelNumber"];

  // Category ID
  optional string category_id = 8 [json_name = "categoryId"];

  // Supplier ID
  optional string supplier_id = 9 [json_name = "supplierId"];

  // Location ID (when not assigned to a user)
  optional string location_id = 10 [json_name = "locationId"];

  // Portal user ID (when assigned)
  optional uint32 user_id = 40 [json_name = "userId"];

  // Asset status
  optional AssetStatus status = 12 [json_name = "status"];

  // Photo storage key in S3
  optional string photo_key = 13 [json_name = "photoKey"];

  // Warranty duration in months
  optional int32 warranty_months = 14 [json_name = "warrantyMonths"];

  // Purchase date
  optional google.protobuf.Timestamp purchase_date = 15 [json_name = "purchaseDate"];

  // Order number
  optional string order_number = 16 [json_name = "orderNumber"];

  // Purchase cost
  optional double purchase_cost = 17 [json_name = "purchaseCost"];

  // Notes
  optional string notes = 18 [json_name = "notes"];

  // Custom tags (JSON)
  optional string tags = 19 [json_name = "tags"];

  // Custom metadata (JSON)
  google.protobuf.Struct metadata = 20 [json_name = "metadata"];

  // Salvage value (typically 10% of purchase cost)
  optional double salvage_value = 21 [json_name = "salvageValue"];

  // Useful life in years
  optional int32 useful_life_years = 22 [json_name = "usefulLifeYears"];

  // Depreciation rate (default 0.40 for DDB)
  optional double depreciation_rate = 23 [json_name = "depreciationRate"];

  // Creation timestamp
  optional google.protobuf.Timestamp created_at = 30 [json_name = "createdAt"];

  // Last update timestamp
  optional google.protobuf.Timestamp updated_at = 31 [json_name = "updatedAt"];

  // Creator user ID
  optional uint32 created_by = 32 [json_name = "createdBy"];

  // Last updater user ID
  optional uint32 updated_by = 33 [json_name = "updatedBy"];
}

// AssetAssignment represents a historical record of asset assignment changes
message AssetAssignment {
  // Unique identifier
  optional string id = 1 [json_name = "id"];

  // Asset ID
  optional string asset_id = 2 [json_name = "assetId"];

  // Asset name (denormalized)
  optional string asset_name = 3 [json_name = "assetName"];

  // Portal user ID
  optional uint32 user_id = 11 [json_name = "userId"];

  // User display name (denormalized)
  optional string user_name = 12 [json_name = "userName"];

  // Assignment action
  optional AssignmentAction action = 6 [json_name = "action"];

  // When the asset was assigned
  optional google.protobuf.Timestamp assigned_at = 7 [json_name = "assignedAt"];

  // When the asset was returned
  optional google.protobuf.Timestamp returned_at = 8 [json_name = "returnedAt"];

  // Who performed the assignment
  optional uint32 assigned_by = 9 [json_name = "assignedBy"];

  // Notes
  optional string notes = 10 [json_name = "notes"];
}

// AssetDocument represents a file attached to an asset or consumable
message AssetDocument {
  // Unique identifier
  optional string id = 1 [json_name = "id"];

  // Entity type (asset or consumable)
  optional string entity_type = 2 [json_name = "entityType"];

  // Entity ID
  optional string entity_id = 3 [json_name = "entityId"];

  // Original file name
  optional string file_name = 4 [json_name = "fileName"];

  // File size in bytes
  optional int64 file_size = 5 [json_name = "fileSize"];

  // MIME type
  optional string mime_type = 6 [json_name = "mimeType"];

  // Storage key in S3
  optional string storage_key = 7 [json_name = "storageKey"];

  // SHA-256 checksum
  optional string checksum = 8 [json_name = "checksum"];

  // Description
  optional string description = 9 [json_name = "description"];

  // Creation timestamp
  optional google.protobuf.Timestamp created_at = 10 [json_name = "createdAt"];

  // Creator user ID
  optional uint32 created_by = 11 [json_name = "createdBy"];
}

// CreateAssetRequest creates a new asset
message CreateAssetRequest {
  optional uint32 tenant_id = 1 [
    json_name = "tenantId",
    (google.api.field_behavior) = REQUIRED
  ];

  optional string asset_tag = 2 [
    json_name = "assetTag",
    (buf.validate.field).string.max_len = 255
  ];

  optional string name = 3 [
    json_name = "name",
    (buf.validate.field).string.max_len = 255
  ];

  optional string serial = 4 [json_name = "serial"];
  optional string model_name = 5 [json_name = "modelName"];
  optional string model_number = 6 [json_name = "modelNumber"];
  optional string category_id = 7 [json_name = "categoryId"];
  optional string supplier_id = 8 [json_name = "supplierId"];
  optional string location_id = 9 [json_name = "locationId"];
  optional AssetStatus status = 10 [json_name = "status"];
  optional int32 warranty_months = 11 [json_name = "warrantyMonths"];
  optional google.protobuf.Timestamp purchase_date = 12 [json_name = "purchaseDate"];
  optional string order_number = 13 [json_name = "orderNumber"];
  optional double purchase_cost = 14 [json_name = "purchaseCost"];
  optional string notes = 15 [json_name = "notes"];
  optional string tags = 16 [json_name = "tags"];
  google.protobuf.Struct metadata = 17 [json_name = "metadata"];
  optional double salvage_value = 18 [json_name = "salvageValue"];
  optional int32 useful_life_years = 19 [json_name = "usefulLifeYears"];
  optional double depreciation_rate = 20 [json_name = "depreciationRate"];
}

message CreateAssetResponse {
  Asset asset = 1 [json_name = "asset"];
}

// GetAssetRequest retrieves an asset by ID
message GetAssetRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
}

message GetAssetResponse {
  Asset asset = 1 [json_name = "asset"];
}

// ListAssetsRequest lists assets with filtering
message ListAssetsRequest {
  optional uint32 tenant_id = 1 [json_name = "tenantId"];
  optional int32 page = 2 [json_name = "page"];
  optional int32 page_size = 3 [json_name = "pageSize"];
  optional bool no_paging = 4 [json_name = "noPaging"];
  optional string query = 5 [json_name = "query"];
  repeated string order_by = 6 [json_name = "orderBy"];
  optional string field_mask = 7 [json_name = "fieldMask"];

  // Filter by status
  optional AssetStatus status = 10 [json_name = "status"];

  // Filter by category
  optional string category_id = 11 [json_name = "categoryId"];

  // Filter by supplier
  optional string supplier_id = 12 [json_name = "supplierId"];

  // Filter by location
  optional string location_id = 13 [json_name = "locationId"];

  // Filter by assigned user
  optional uint32 user_id = 14 [json_name = "userId"];
}

message ListAssetsResponse {
  repeated Asset items = 1 [json_name = "items"];
  optional int32 total = 2 [json_name = "total"];
}

// UpdateAssetRequest updates an asset
message UpdateAssetRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  optional Asset data = 2 [json_name = "data"];

  google.protobuf.FieldMask update_mask = 3 [json_name = "updateMask"];
}

message UpdateAssetResponse {
  Asset asset = 1 [json_name = "asset"];
}

// DeleteAssetRequest deletes an asset
message DeleteAssetRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
}

// AssignAssetRequest assigns an asset to a user
message AssignAssetRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  uint32 user_id = 2 [
    json_name = "userId",
    (google.api.field_behavior) = REQUIRED
  ];

  optional string notes = 3 [json_name = "notes"];
}

message AssignAssetResponse {
  Asset asset = 1 [json_name = "asset"];
}

// UnassignAssetRequest unassigns an asset from a user
message UnassignAssetRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  // Optional location to move the asset to after unassignment
  optional string location_id = 2 [json_name = "locationId"];

  optional string notes = 3 [json_name = "notes"];
}

message UnassignAssetResponse {
  Asset asset = 1 [json_name = "asset"];
}

// GetAssignmentHistoryRequest retrieves assignment history for an asset
message GetAssignmentHistoryRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  optional int32 page = 2 [json_name = "page"];
  optional int32 page_size = 3 [json_name = "pageSize"];
}

message GetAssignmentHistoryResponse {
  repeated AssetAssignment items = 1 [json_name = "items"];
  optional int32 total = 2 [json_name = "total"];
}

// UploadPhotoRequest uploads a photo for an asset
message UploadPhotoRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  string file_name = 2 [json_name = "fileName"];
  bytes content = 3 [json_name = "content"];
  string mime_type = 4 [json_name = "mimeType"];
}

message UploadPhotoResponse {
  Asset asset = 1 [json_name = "asset"];
}

// DeletePhotoRequest deletes an asset photo
message DeletePhotoRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
}

// ListDocumentsRequest lists documents for an asset
message ListAssetDocumentsRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
}

message ListAssetDocumentsResponse {
  repeated AssetDocument items = 1 [json_name = "items"];
}

// UploadDocumentRequest uploads a document for an asset
message UploadAssetDocumentRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  string file_name = 2 [json_name = "fileName"];
  bytes content = 3 [json_name = "content"];
  string mime_type = 4 [json_name = "mimeType"];
  optional string description = 5 [json_name = "description"];
}

message UploadAssetDocumentResponse {
  AssetDocument document = 1 [json_name = "document"];
}

// DeleteDocumentRequest deletes a document
message DeleteAssetDocumentRequest {
  string asset_id = 1 [
    json_name = "assetId",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  string id = 2 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
}

// DownloadDocumentRequest downloads a document
message DownloadAssetDocumentRequest {
  string asset_id = 1 [
    json_name = "assetId",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  string id = 2 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
}

message DownloadDocumentResponse {
  string file_name = 1 [json_name = "fileName"];
  bytes content = 2 [json_name = "content"];
  string mime_type = 3 [json_name = "mimeType"];
}

// --- Inventory Sync ---

message InventorySyncPreviewRequest {}

message InventorySyncChange {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_CREATE = 1;
    ACTION_UPDATE = 2;
  }
  Action action = 1 [json_name = "action"];
  string hostname = 2 [json_name = "hostname"];
  string serial = 3 [json_name = "serial"];
  string model_name = 4 [json_name = "modelName"];
  repeated string changed_fields = 5 [json_name = "changedFields"];
  string existing_id = 6 [json_name = "existingId"];
}

message InventorySyncPreviewResponse {
  int32 total_inventory_entries = 1 [json_name = "totalInventoryEntries"];
  int32 new_count = 2 [json_name = "newCount"];
  int32 update_count = 3 [json_name = "updateCount"];
  int32 unchanged_count = 4 [json_name = "unchangedCount"];
  repeated InventorySyncChange changes = 5 [json_name = "changes"];
  repeated string warnings = 6 [json_name = "warnings"];
}

message InventorySyncExecuteRequest {
  repeated string selected_hostnames = 1 [json_name = "selectedHostnames"];
}

message InventorySyncExecuteResponse {
  int32 created_count = 1 [json_name = "createdCount"];
  int32 updated_count = 2 [json_name = "updatedCount"];
  int32 skipped_count = 3 [json_name = "skippedCount"];
  int32 error_count = 4 [json_name = "errorCount"];
  repeated string errors = 5 [json_name = "errors"];
}

// AssetService manages IT assets
service AssetService {
  // Create a new asset
  rpc CreateAsset(CreateAssetRequest) returns (CreateAssetResponse) {
    option (google.api.http) = {
      post: "/v1/assets"
      body: "*"
    };
  }

  // Get an asset by ID
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse) {
    option (google.api.http) = {
      get: "/v1/assets/{id}"
    };
  }

  // List assets with filtering
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse) {
    option (google.api.http) = {
      get: "/v1/assets"
    };
  }

  // Update an asset
  rpc UpdateAsset(UpdateAssetRequest) returns (UpdateAssetResponse) {
    option (google.api.http) = {
      put: "/v1/assets/{id}"
      body: "*"
    };
  }

  // Delete an asset
  rpc DeleteAsset(DeleteAssetRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/assets/{id}"
    };
  }

  // Assign an asset to a user
  rpc AssignAsset(AssignAssetRequest) returns (AssignAssetResponse) {
    option (google.api.http) = {
      post: "/v1/assets/{id}/assign"
      body: "*"
    };
  }

  // Unassign an asset from a user
  rpc UnassignAsset(UnassignAssetRequest) returns (UnassignAssetResponse) {
    option (google.api.http) = {
      post: "/v1/assets/{id}/unassign"
      body: "*"
    };
  }

  // Get assignment history for an asset
  rpc GetAssignmentHistory(GetAssignmentHistoryRequest) returns (GetAssignmentHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/assets/{id}/assignments"
    };
  }

  // Upload a photo for an asset
  rpc UploadPhoto(UploadPhotoRequest) returns (UploadPhotoResponse) {
    option (google.api.http) = {
      post: "/v1/assets/{id}/photo"
      body: "*"
    };
  }

  // Delete an asset photo
  rpc DeletePhoto(DeletePhotoRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/assets/{id}/photo"
    };
  }

  // List documents for an asset
  rpc ListDocuments(ListAssetDocumentsRequest) returns (ListAssetDocumentsResponse) {
    option (google.api.http) = {
      get: "/v1/assets/{id}/documents"
    };
  }

  // Upload a document for an asset
  rpc UploadDocument(UploadAssetDocumentRequest) returns (UploadAssetDocumentResponse) {
    option (google.api.http) = {
      post: "/v1/assets/{id}/documents"
      body: "*"
    };
  }

  // Delete a document
  rpc DeleteDocument(DeleteAssetDocumentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/assets/{asset_id}/documents/{id}"
    };
  }

  // Download a document
  rpc DownloadDocument(DownloadAssetDocumentRequest) returns (DownloadDocumentResponse) {
    option (google.api.http) = {
      get: "/v1/assets/{asset_id}/documents/{id}/download"
    };
  }

  // Preview inventory sync changes
  rpc InventorySyncPreview(InventorySyncPreviewRequest) returns (InventorySyncPreviewResponse) {
    option (google.api.http) = {
      post: "/v1/assets/inventory-sync/preview"
      body: "*"
    };
  }

  // Execute inventory sync
  rpc InventorySyncExecute(InventorySyncExecuteRequest) returns (InventorySyncExecuteResponse) {
    option (google.api.http) = {
      post: "/v1/assets/inventory-sync/execute"
      body: "*"
    };
  }
}
