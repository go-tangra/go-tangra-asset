syntax = "proto3";

package asset.service.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

// Category represents a classification for assets and consumables
message Category {
  // Unique identifier
  optional string id = 1 [json_name = "id"];

  // Tenant ID for multi-tenancy
  optional uint32 tenant_id = 2 [json_name = "tenantId"];

  // Category name
  optional string name = 3 [json_name = "name"];

  // Description
  optional string description = 4 [json_name = "description"];

  // Parent category ID (for hierarchy)
  optional string parent_id = 5 [json_name = "parentId"];

  // Icon name
  optional string icon = 6 [json_name = "icon"];

  // Number of assets in this category
  optional int32 asset_count = 7 [json_name = "assetCount"];

  // Number of child categories
  optional int32 child_count = 8 [json_name = "childCount"];

  // Creation timestamp
  optional google.protobuf.Timestamp created_at = 20 [json_name = "createdAt"];

  // Last update timestamp
  optional google.protobuf.Timestamp updated_at = 21 [json_name = "updatedAt"];

  // Creator user ID
  optional uint32 created_by = 22 [json_name = "createdBy"];

  // Last updater user ID
  optional uint32 updated_by = 23 [json_name = "updatedBy"];
}

// CreateCategoryRequest creates a new category
message CreateCategoryRequest {
  optional uint32 tenant_id = 1 [
    json_name = "tenantId",
    (google.api.field_behavior) = REQUIRED
  ];

  optional string name = 2 [
    json_name = "name",
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255,
    (google.api.field_behavior) = REQUIRED
  ];

  optional string description = 3 [json_name = "description"];
  optional string parent_id = 4 [json_name = "parentId"];
  optional string icon = 5 [json_name = "icon"];
}

message CreateCategoryResponse {
  Category category = 1 [json_name = "category"];
}

// GetCategoryRequest retrieves a category by ID
message GetCategoryRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
}

message GetCategoryResponse {
  Category category = 1 [json_name = "category"];
}

// ListCategoriesRequest lists categories with filtering
message ListCategoriesRequest {
  optional uint32 tenant_id = 1 [json_name = "tenantId"];
  optional int32 page = 2 [json_name = "page"];
  optional int32 page_size = 3 [json_name = "pageSize"];
  optional bool no_paging = 4 [json_name = "noPaging"];
  optional string query = 5 [json_name = "query"];
  repeated string order_by = 6 [json_name = "orderBy"];
  optional string field_mask = 7 [json_name = "fieldMask"];

  // Filter by parent
  optional string parent_id = 10 [json_name = "parentId"];
}

message ListCategoriesResponse {
  repeated Category items = 1 [json_name = "items"];
  optional int32 total = 2 [json_name = "total"];
}

// UpdateCategoryRequest updates a category
message UpdateCategoryRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  optional Category data = 2 [json_name = "data"];

  google.protobuf.FieldMask update_mask = 3 [json_name = "updateMask"];
}

message UpdateCategoryResponse {
  Category category = 1 [json_name = "category"];
}

// DeleteCategoryRequest deletes a category
message DeleteCategoryRequest {
  string id = 1 [
    json_name = "id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
}

// GetCategoryTreeRequest retrieves category hierarchy
message GetCategoryTreeRequest {
  optional uint32 tenant_id = 1 [json_name = "tenantId"];
  optional string root_id = 2 [json_name = "rootId"];
}

message CategoryTreeNode {
  Category category = 1 [json_name = "category"];
  repeated CategoryTreeNode children = 2 [json_name = "children"];
}

message GetCategoryTreeResponse {
  repeated CategoryTreeNode nodes = 1 [json_name = "nodes"];
}

// CategoryService manages asset categories
service CategoryService {
  // Create a new category
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse) {
    option (google.api.http) = {
      post: "/v1/categories"
      body: "*"
    };
  }

  // Get a category by ID
  rpc GetCategory(GetCategoryRequest) returns (GetCategoryResponse) {
    option (google.api.http) = {
      get: "/v1/categories/{id}"
    };
  }

  // List categories with filtering
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse) {
    option (google.api.http) = {
      get: "/v1/categories"
    };
  }

  // Update a category
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse) {
    option (google.api.http) = {
      put: "/v1/categories/{id}"
      body: "*"
    };
  }

  // Delete a category
  rpc DeleteCategory(DeleteCategoryRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/categories/{id}"
    };
  }

  // Get category tree hierarchy
  rpc GetCategoryTree(GetCategoryTreeRequest) returns (GetCategoryTreeResponse) {
    option (google.api.http) = {
      get: "/v1/categories/tree"
    };
  }
}
