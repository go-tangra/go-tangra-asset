openapi: 3.1.0
info:
  title: Asset API
  version: 0.1.0
  description: >
    IT asset management: assets with an assign/unassign lifecycle, photos and
    documents in object storage, categories and locations (trees), suppliers,
    consumables, licenses, insurance policies with per-asset coverage, inventory
    sync against the platform inventory module, server-side depreciation,
    dashboard statistics and tenant backup. Gateway-proxied under /api/asset.
    Every route declares an x-freya-permission (or x-freya-public). No response
    carries object-store credentials or sealed supplier/location contact PII.
servers:
  - url: /
components:
  parameters:
    csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
    id:
      name: id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
      example: '018f3a2b-0000-7000-8000-000000000001'
    docId:
      name: doc_id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
      example: '018f3a2b-0000-7000-8000-000000000002'
    assetId:
      name: asset_id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
      example: '018f3a2b-0000-7000-8000-000000000003'
    cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 64 }
    limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500 }
    query:
      name: query
      in: query
      required: false
      schema: { type: string, maxLength: 200 }
    # List contract (go-tangra specs/032-server-side-tables, contracts/http-list.md).
    # cursor / limit (legacy, one release) cannot be combined with these.
    page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 2147483647 }
    pageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200 }
    order:
      name: order
      in: query
      required: false
      description: 'sort direction; defaults to the chosen field''s default direction'
      schema: { type: string, enum: [asc, desc] }
  schemas:
    ListPage:
      type: object
      description: 'one page of a list (a page beyond the end answers the last page); legacy cursor / limit requests answer {items, total}'
      required: [items, total]
      properties:
        items: { type: array, items: { type: object } }
        total: { type: integer, description: 'records matching the filters' }
        page: { type: integer }
        page_size: { type: integer }
        sort: { type: string }
        order: { type: string, enum: [asc, desc] }
    InventorySyncSettings:
      type: object
      additionalProperties: false
      description: 'Hosts matching these filters are neither created nor updated as assets (feature 030). Patterns are case-insensitive globs.'
      properties:
        exclude_vms: { type: boolean }
        exclude_containers: { type: boolean }
        skip_stale: { type: boolean }
        skip_retired: { type: boolean }
        hostname_include: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
        hostname_exclude: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
        os_include: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
        os_exclude: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
    Error:
      type: object
      properties:
        reason: { type: string }
        detail: { type: object }
      example:
        reason: not_found
        detail: {}
paths:
  # ---- Assets
  /api/asset/v1/assets:
    get: { operationId: listAssets, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { name: sort, in: query, description: 'default asset_tag (asc)', schema: { type: string, enum: [asset_tag, name, status, category, location, purchase_date, warranty_end, created_at] } }, { $ref: '#/components/parameters/order' }, { $ref: '#/components/parameters/query' }, { name: status, in: query, schema: { type: string, maxLength: 32 } }, { name: category_id, in: query, schema: { type: string, maxLength: 64 } }, { name: supplier_id, in: query, schema: { type: string, maxLength: 64 } }, { name: location_id, in: query, schema: { type: string, maxLength: 64 } }, { name: user_id, in: query, schema: { type: string, maxLength: 64 } }], responses: { '200': { description: 'page of assets', content: { application/json: { schema: { $ref: '#/components/schemas/ListPage' } } } } } }
    post: { operationId: createAsset, x-freya-permission: 'assets:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: created }, '409': { description: conflict } } }
  /api/asset/v1/assets/inventory-sync/preview:
    post: { operationId: inventorySyncPreview, x-freya-permission: 'inventory:sync', x-freya-timeout-seconds: 60, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '200': { description: 'sync preview (create/update/unchanged)' }, '503': { description: 'inventory unavailable' } } }
  /api/asset/v1/assets/inventory-sync/settings:
    get: { operationId: getInventorySyncSettings, x-freya-permission: 'inventory:sync', responses: { '200': { description: 'persisted inventory-sync filter settings' } } }
    put: { operationId: putInventorySyncSettings, x-freya-permission: 'inventory:sync', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventorySyncSettings' } } } }, responses: { '200': { description: 'stored' }, '422': { description: validation_failed } } }
  /api/asset/v1/assets/inventory-sync/execute:
    post: { operationId: inventorySyncExecute, x-freya-permission: 'inventory:sync', x-freya-max-body-bytes: 1048576, x-freya-timeout-seconds: 120, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '200': { description: 'sync result' }, '503': { description: 'inventory unavailable' } } }
  /api/asset/v1/assets/{id}:
    get: { operationId: getAsset, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: 'asset (with computed book value)' }, '404': { description: not_found } } }
    put: { operationId: updateAsset, x-freya-permission: 'assets:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: updated }, '404': { description: not_found }, '409': { description: conflict } } }
    delete: { operationId: deleteAsset, x-freya-permission: 'assets:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '204': { description: deleted } } }
  /api/asset/v1/assets/{id}/assign:
    post: { operationId: assignAsset, x-freya-permission: 'assets:assign', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: assigned }, '409': { description: 'not deployable' } } }
  /api/asset/v1/assets/{id}/unassign:
    post: { operationId: unassignAsset, x-freya-permission: 'assets:assign', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: unassigned }, '409': { description: 'not assigned' } } }
  /api/asset/v1/assets/{id}/assignments:
    get: { operationId: listAssetAssignments, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { name: sort, in: query, description: 'default assigned_at (desc)', schema: { type: string, enum: [assigned_at, returned_at] } }, { $ref: '#/components/parameters/order' }], responses: { '200': { description: 'assignment history (newest first by default)', content: { application/json: { schema: { $ref: '#/components/schemas/ListPage' } } } } } }
  /api/asset/v1/assets/{id}/photo:
    get: { operationId: getAssetPhoto, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: 'photo bytes' }, '404': { description: not_found } } }
    post: { operationId: uploadAssetPhoto, x-freya-permission: 'documents:manage', x-freya-max-body-bytes: 20971520, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: 'photo stored' } } }
    delete: { operationId: deleteAssetPhoto, x-freya-permission: 'documents:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '204': { description: deleted } } }
  /api/asset/v1/documents/search:
    get: { operationId: searchDocuments, x-freya-permission: 'assets:read', x-freya-timeout-seconds: 30, parameters: [{ name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }, { $ref: '#/components/parameters/page' }, { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }, { name: sort, in: query, description: 'relevance only (best first)', schema: { type: string, enum: [rank] } }], responses: { '200': { description: 'documents matching the text, best first: a page of the top 100 hits (items of {document, snippet, rank})', content: { application/json: { schema: { $ref: '#/components/schemas/ListPage' } } } }, '503': { description: 'paperless unavailable' } } }
  /api/asset/v1/assets/{id}/documents:
    get: { operationId: listAssetDocuments, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: documents } } }
    post: { operationId: uploadAssetDocument, x-freya-permission: 'documents:manage', x-freya-max-body-bytes: 20971520, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '201': { description: uploaded } } }
  /api/asset/v1/assets/{id}/documents/{doc_id}:
    delete: { operationId: deleteAssetDocument, x-freya-permission: 'documents:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/docId' }], responses: { '204': { description: deleted } } }
  /api/asset/v1/assets/{id}/documents/{doc_id}/download:
    get: { operationId: downloadAssetDocument, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/docId' }], responses: { '200': { description: 'document bytes' }, '404': { description: not_found } } }
  # ---- Categories
  /api/asset/v1/categories:
    get: { operationId: listCategories, x-freya-permission: 'assets:read', responses: { '200': { description: list } } }
    post: { operationId: createCategory, x-freya-permission: 'categories:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: created }, '409': { description: conflict } } }
  /api/asset/v1/categories/tree:
    get: { operationId: getCategoryTree, x-freya-permission: 'assets:read', responses: { '200': { description: 'nested tree with counts' } } }
  /api/asset/v1/categories/{id}:
    get: { operationId: getCategory, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: category }, '404': { description: not_found } } }
    put: { operationId: updateCategory, x-freya-permission: 'categories:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: updated } } }
    delete: { operationId: deleteCategory, x-freya-permission: 'categories:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '204': { description: deleted }, '409': { description: 'in use' } } }
  # ---- Suppliers
  /api/asset/v1/suppliers:
    get: { operationId: listSuppliers, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/query' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { name: sort, in: query, description: 'default name (asc)', schema: { type: string, enum: [name, created_at] } }, { $ref: '#/components/parameters/order' }], responses: { '200': { description: 'page of suppliers', content: { application/json: { schema: { $ref: '#/components/schemas/ListPage' } } } } } }
    post: { operationId: createSupplier, x-freya-permission: 'suppliers:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: created }, '409': { description: conflict } } }
  /api/asset/v1/suppliers/{id}:
    get: { operationId: getSupplier, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: 'supplier (contact PII redacted unless admin)' }, '404': { description: not_found } } }
    put: { operationId: updateSupplier, x-freya-permission: 'suppliers:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: updated } } }
    delete: { operationId: deleteSupplier, x-freya-permission: 'suppliers:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '204': { description: deleted }, '409': { description: 'in use' } } }
  # ---- Locations
  /api/asset/v1/locations:
    get: { operationId: listLocations, x-freya-permission: 'assets:read', responses: { '200': { description: list } } }
    post: { operationId: createLocation, x-freya-permission: 'locations:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: created }, '409': { description: conflict } } }
  /api/asset/v1/locations/tree:
    get: { operationId: getLocationTree, x-freya-permission: 'assets:read', responses: { '200': { description: 'nested tree with counts' } } }
  /api/asset/v1/locations/{id}:
    get: { operationId: getLocation, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: 'location (contact PII redacted unless admin)' }, '404': { description: not_found } } }
    put: { operationId: updateLocation, x-freya-permission: 'locations:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: updated } } }
    delete: { operationId: deleteLocation, x-freya-permission: 'locations:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '204': { description: deleted }, '409': { description: 'in use' } } }
  # ---- Consumables
  /api/asset/v1/consumables:
    get: { operationId: listConsumables, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/query' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { name: sort, in: query, description: 'default name (asc)', schema: { type: string, enum: [name, amount, created_at] } }, { $ref: '#/components/parameters/order' }], responses: { '200': { description: 'page of consumables', content: { application/json: { schema: { $ref: '#/components/schemas/ListPage' } } } } } }
    post: { operationId: createConsumable, x-freya-permission: 'consumables:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: created } } }
  /api/asset/v1/consumables/{id}:
    get: { operationId: getConsumable, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: consumable }, '404': { description: not_found } } }
    put: { operationId: updateConsumable, x-freya-permission: 'consumables:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: updated } } }
    delete: { operationId: deleteConsumable, x-freya-permission: 'consumables:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '204': { description: deleted } } }
  /api/asset/v1/consumables/{id}/documents:
    get: { operationId: listConsumableDocuments, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: documents } } }
    post: { operationId: uploadConsumableDocument, x-freya-permission: 'documents:manage', x-freya-max-body-bytes: 20971520, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '201': { description: uploaded } } }
  /api/asset/v1/consumables/{id}/documents/{doc_id}:
    delete: { operationId: deleteConsumableDocument, x-freya-permission: 'documents:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/docId' }], responses: { '204': { description: deleted } } }
  /api/asset/v1/consumables/{id}/documents/{doc_id}/download:
    get: { operationId: downloadConsumableDocument, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/docId' }], responses: { '200': { description: 'document bytes' } } }
  # ---- Licenses
  /api/asset/v1/licenses:
    get: { operationId: listLicenses, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/query' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { name: sort, in: query, description: 'default name (asc)', schema: { type: string, enum: [name, valid_to, created_at] } }, { $ref: '#/components/parameters/order' }], responses: { '200': { description: 'page of licenses', content: { application/json: { schema: { $ref: '#/components/schemas/ListPage' } } } } } }
    post: { operationId: createLicense, x-freya-permission: 'licenses:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: created } } }
  /api/asset/v1/licenses/{id}:
    get: { operationId: getLicense, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: license }, '404': { description: not_found } } }
    put: { operationId: updateLicense, x-freya-permission: 'licenses:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: updated } } }
    delete: { operationId: deleteLicense, x-freya-permission: 'licenses:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '204': { description: deleted } } }
  /api/asset/v1/licenses/{id}/documents:
    get: { operationId: listLicenseDocuments, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: documents } } }
    post: { operationId: uploadLicenseDocument, x-freya-permission: 'documents:manage', x-freya-max-body-bytes: 20971520, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '201': { description: uploaded } } }
  /api/asset/v1/licenses/{id}/documents/{doc_id}:
    delete: { operationId: deleteLicenseDocument, x-freya-permission: 'documents:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/docId' }], responses: { '204': { description: deleted } } }
  /api/asset/v1/licenses/{id}/documents/{doc_id}/download:
    get: { operationId: downloadLicenseDocument, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/docId' }], responses: { '200': { description: 'document bytes' } } }
  # ---- Insurance policies
  /api/asset/v1/insurance-policies:
    get: { operationId: listInsurancePolicies, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/query' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { name: sort, in: query, description: 'default name (asc)', schema: { type: string, enum: [name, valid_to, created_at] } }, { $ref: '#/components/parameters/order' }], responses: { '200': { description: 'page of policies', content: { application/json: { schema: { $ref: '#/components/schemas/ListPage' } } } } } }
    post: { operationId: createInsurancePolicy, x-freya-permission: 'insurance:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: created }, '409': { description: conflict } } }
  /api/asset/v1/insurance-policies/{id}:
    get: { operationId: getInsurancePolicy, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: policy }, '404': { description: not_found } } }
    put: { operationId: updateInsurancePolicy, x-freya-permission: 'insurance:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: updated } } }
    delete: { operationId: deleteInsurancePolicy, x-freya-permission: 'insurance:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '204': { description: deleted } } }
  /api/asset/v1/insurance-policies/{id}/assets:
    get: { operationId: listPolicyAssets, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { name: sort, in: query, description: 'default asset_tag (asc)', schema: { type: string, enum: [asset_tag, name] } }, { $ref: '#/components/parameters/order' }], responses: { '200': { description: 'page of covered assets', content: { application/json: { schema: { $ref: '#/components/schemas/ListPage' } } } } } }
    post: { operationId: addAssetToPolicy, x-freya-permission: 'insurance:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '201': { description: added }, '409': { description: 'already covered' } } }
  /api/asset/v1/insurance-policies/{id}/assets/{asset_id}:
    delete: { operationId: removeAssetFromPolicy, x-freya-permission: 'insurance:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/assetId' }], responses: { '204': { description: removed } } }
  # ---- Users (assignee directory), system, backup, realtime
  /api/asset/v1/users:
    get: { operationId: listUsers, x-freya-permission: 'assets:read', parameters: [{ $ref: '#/components/parameters/query' }], responses: { '200': { description: 'tenant users (id + display name)' } } }
  /api/asset/v1/health:
    get: { operationId: health, x-freya-public: true, responses: { '200': { description: healthy } } }
  /api/asset/v1/stats:
    get: { operationId: getDashboardStats, x-freya-permission: 'stats:read', responses: { '200': { description: 'dashboard statistics' } } }
  /api/asset/v1/backup/export:
    post: { operationId: exportBackup, x-freya-permission: 'backup:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '200': { description: export } } }
  /api/asset/v1/backup/import:
    post: { operationId: importBackup, x-freya-permission: 'backup:manage', x-freya-max-body-bytes: 33554432, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '200': { description: imported }, '403': { description: 'full restore requires platform-admin' } } }
  /api/asset/v1/stream:
    get: { operationId: streamEvents, x-freya-permission: 'assets:read', responses: { '200': { description: 'SSE event stream (assigned/unassigned/expiring/low-stock)' } } }
